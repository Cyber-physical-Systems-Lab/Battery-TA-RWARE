[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-tarware"
version = "2.0.0"
description = "Battery-TA-RWARE: heterogeneous multi-robot cooperation under battery constraints (Gymnasium + PettingZoo)"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Xuezhi Niu"}, {name = "Cyber-physical Systems Lab, Uppsala University"}]
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["multi-robot", "task allocation", "coalition formation", "warehouse", "battery", "gymnasium",
            "pettingzoo", "reinforcement learning", "multi-agent path finding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
pettingzoo = ["pettingzoo>=1.24"]
yaml = ["pyyaml>=6.0"]
render = ["matplotlib>=3.6"]
test = ["pytest>=7", "pettingzoo>=1.24", "pyyaml>=6.0"]
all = ["pettingzoo>=1.24", "pyyaml>=6.0", "matplotlib>=3.6"]

[project.urls]
Repository = "https://github.com/Cyber-physical-Systems-Lab/Battery-TA-RWARE"

[tool.setuptools.packages.find]
include = ["battery_tarware*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
